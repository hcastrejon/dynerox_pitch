<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dynerox Investor Room</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#061021">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --navy: #061021; --green: #00bc0a; --muted: rgba(255,255,255,.68); color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: var(--navy); color: #fff;
    font: 16px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
  main { max-width: 440px; }
  img { width: 140px; height: auto; display: block; margin-bottom: 36px; }
  h1 { font-size: 30px; line-height: 1.1; letter-spacing: -0.04em; margin: 0 0 14px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.btn { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 14px; background: var(--green); color: #fff; font-weight: 600; text-decoration: none; }
  .mail { display: block; margin-top: 18px; color: #fff; }
</style>
</head>
<body>
  <main>
    <img src="/img/logo-light.webp" alt="Dynerox" width="140" height="32">
    <h1>The Dynerox investor room is shared by invitation.</h1>
    <p>If you received a personal link, open that link. To request access, write to us.</p>
    <a class="btn" href="https://dynerox.com/" rel="noopener">Visit dynerox.com</a>
    <a class="mail" href="mailto:partnerships@dynerox.com">partnerships@dynerox.com</a>
  </main>
</body>
</html>
